<!DOCTYPE html>
<html>
<head>
<title>My Profile</title>

<style>
  .back-btn {
  text-decoration: none;
  background: #333;
  color: white;
  padding: 8px 15px;
  border-radius: 20px;
  transition: 0.3s;
}

.back-btn:hover {
  background: #000;
}
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
}

/* HEADER */
header {
  background: #ee4d2d;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header input {
  width: 40%;
  padding: 10px;
  border: none;
  border-radius: 5px;
}

/* LAYOUT */
.container {
  display: flex;
  padding: 20px;
}

/* LEFT MENU */
.sidebar {
  width: 250px;
}

.sidebar h3 {
  margin-bottom: 10px;
}

.sidebar a {
  display: block;
  color: #ccc;
  padding: 8px 0;
  text-decoration: none;
}

.sidebar a:hover {
  color: #ee4d2d;
}

/* MAIN PROFILE */
.main {
  flex: 1;
  background: #1c1c1c;
  padding: 20px;
  border-radius: 10px;
}

/* FORM */
.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  color: #aaa;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 5px;
  border: none;
}

/* RIGHT IMAGE */
.profile-img {
  text-align: center;
}

.profile-img img {
  width: 100px;
  border-radius: 50%;
  margin-bottom: 10px;
}

/* BUTTON */
button {
  background: #ee4d2d;
  border: none;
  padding: 10px 20px;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #d84315;
}
</style>

</head>

<body>

<header>
  <h2>🛒 SASA Shop</h2>
  <input placeholder="🔍 Search...">
</header>

<div class="container">

  <!-- LEFT -->
  <div class="sidebar">
    <h3>👤 Username</h3>
    <a href="#">📄 Profile</a>
    <a href="#">🏦 Banks</a>
    <a href="#">📍 Address</a>
    <a href="#">🔒 Change Password</a>
    <a href="#">🔔 Notifications</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <h2>My Profile</h2>
    <p style="color:#aaa;">Manage your account</p>

    <div style="display:flex; gap:30px;">

      <!-- FORM -->
      <div style="flex:1;">

        <div class="form-group">
          <label>Username</label>
          <input value="user123">
        </div>

        <div class="form-group">
          <label>Name</label>
          <input placeholder="Your name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input placeholder="email@gmail.com">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input placeholder="012345678">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date">
        </div>

        <button onclick="save()">💾 Save</button>

      </div>

      <!-- IMAGE -->
      <div class="profile-img">
        <img src="https://via.placeholder.com/100">
        <p>Select Image</p>
        <input type="file">
      </div>

    </div>

  </div>

</div>

<script>
function save() {
  alert("Saved ✅");
}
</script>

</body>
</html>
<a href="shop.html" class="back-btn">🔙 Back</a>
